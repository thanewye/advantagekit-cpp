name: CI

on:
  push:
  pull_request:

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  build-linux:
    needs: wrapper-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Systemcore
            toolchain: installSystemCoreToolchain
            options: -Ponlylinuxsystemcore
          - name: Linux ARM64
            toolchain: installArm64Toolchain
            options: -Ponlylinuxarm64
          - name: Linux x86-64
            toolchain: ''
            options: ''
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - if: matrix.toolchain != ''
        run: ./gradlew ${{ matrix.toolchain }}
      - run: ./gradlew build -PreleaseMode ${{ matrix.options }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/allOutputs

  build-desktop:
    needs: wrapper-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x86-64
            architecture: x64
            options: -Pbuildalldesktop
          - os: windows-2022
            name: Windows ARM64
            architecture: x64
            options: -Pbuildwinarm64 -Ponlywindowsarm64
          - os: macos-14
            name: macOS universal
            architecture: aarch64
            options: -Pbuildalldesktop
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          architecture: ${{ matrix.architecture }}
      - run: ./gradlew build -PreleaseMode ${{ matrix.options }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/allOutputs

  publish-for-templates:
    if: github.ref_name != '2027' && github.base_ref != '2027'
    needs: wrapper-validation
    name: Publish for template projects
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew installRoboRioToolchain
        working-directory: template_projects/skeleton
      - run: >-
          ./gradlew publish vendordepJson -PreleaseMode
          -PpublishVersion=0.0.0-ci
          -PvendordepMavenUrl=file://${{ github.workspace }}/build/repos/releases
          -PvendordepJsonUrl=https://example.invalid/AdvantageKitCpp.json
      - uses: actions/upload-artifact@v4
        with:
          name: Template Maven
          path: |
            build/repos/releases
            build/vendordep

  build-templates:
    needs: publish-for-templates
    strategy:
      fail-fast: false
      matrix:
        template: [skeleton, diff_drive, kitbot_2026, spark_swerve, talonfx_swerve, vision]
    name: Build template ${{ matrix.template }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: Template Maven
          path: build
      - run: cp build/vendordep/AdvantageKitCpp.json template_projects/${{ matrix.template }}/vendordeps/AdvantageKitCpp.json
      - run: ./gradlew installRoboRioToolchain build
        working-directory: template_projects/${{ matrix.template }}

  combine:
    needs: [build-linux, build-desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wpilibsuite/build-tools
      - uses: actions/download-artifact@v4
        with:
          path: combiner/products/build/allOutputs
      - run: rsync -a --delete combiner/products/build/allOutputs/*/* combiner/products/build/allOutputs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew publish -Pthirdparty
        working-directory: combiner
      - uses: actions/upload-artifact@v4
        with:
          name: Maven
          path: ~/releases
