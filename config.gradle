nativeUtils.addWpiNativeUtils()
nativeUtils.withCrossRoboRIO()
nativeUtils.withCrossLinuxArm32()
nativeUtils.withCrossLinuxArm64()

nativeUtils {
    wpi {
        configureDependencies {
            wpiVersion = wpilibVersion
            opencvYear = 'frc2025'
            niLibVersion = '2026.1.2'
            opencvVersion = '4.10.0-2'
        }
    }
}

nativeUtils.wpi.addWarnings()
nativeUtils.setSinglePrintPerPlatform()

model {
    components {
        all {
            nativeUtils.useAllPlatforms(it)
        }
    }
    binaries {
        withType(NativeBinarySpec).all {
            nativeUtils.usePlatformArguments(it)
        }
    }
}

ext.createComponentZipTasks = { components, names, base, type, project, func ->
    def componentNames = names.collect { it.toString() }
    def binariesByClassifier = [:]

    components.each { component ->
        if (component in NativeLibrarySpec && componentNames.contains(component.name)) {
            component.binaries.each { binary ->
                if (!binary.buildable) {
                    return
                }
                def classifier = nativeUtils.getPublishClassifier(binary)
                binariesByClassifier.computeIfAbsent(classifier) { [] }.add(binary)
            }
        }
    }

    def tasks = []
    binariesByClassifier.each { classifier, binaries ->
        def archiveTask = project.tasks.create("${base}-${classifier}", type) {
            description = "Creates the native archive for ${classifier}."
            destinationDirectory = file("$project.buildDir/outputs")
            archiveClassifier = classifier
            archiveBaseName = "_M_${base}"
            duplicatesStrategy = 'exclude'

            from(licenseFiles) {
                into '/'
            }

            func(it, binaries)
        }
        tasks.add(archiveTask)
        project.tasks.named('build') {
            dependsOn archiveTask
        }
        addTaskToCopyAllOutputs(archiveTask)
    }

    return tasks
}

ext.includeStandardZipFormat = { task, binaries ->
    binaries.each { binary ->
        if (binary instanceof SharedLibraryBinarySpec) {
            task.dependsOn binary.tasks.link
            task.from(binary.sharedLibraryFile) {
                into nativeUtils.getPlatformPath(binary) + '/shared'
            }
            task.from(binary.sharedLibraryLinkFile) {
                into nativeUtils.getPlatformPath(binary) + '/shared'
            }
        } else if (binary instanceof StaticLibraryBinarySpec) {
            task.dependsOn binary.tasks.createStaticLib
            task.from(binary.staticLibraryFile) {
                into nativeUtils.getPlatformPath(binary) + '/static'
            }
        }
    }
}
